<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate OTP</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #effaf1, #d7f2dc);
            color: #183b25;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            width: min(100%, 520px);
            margin: 30px auto;
            padding: 32px;
            background: white;
            border: 1px solid #dceee0;
            border-radius: 20px;
            box-shadow: 0 16px 40px #174c2620;
        }

        .count-row, .button-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .otp-box {
            padding: 24px;
            border: 1px solid #dceee0;
            border-radius: 14px;
            background: #f6fbf7;
            text-align: center;
        }

        .label {
            margin: 0 0 12px;
            color: #66756a;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #otp {
            margin: 0;
            color: #248144;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        .count-row {
            margin: 24px 0 10px;
            font-size: 14px;
        }

        #otpCount {
            color: #24743b;
            font-weight: bold;
        }

        .progress-track {
            height: 9px;
            overflow: hidden;
            border-radius: 10px;
            background: #e9f0ea;
        }

        .history {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e5eee7;
        }

        .history h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        #otpHistory {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #otpHistory li {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f6fbf7;
            color: #66756a;
            font-size: 14px;
        }

        #otpHistory span {
            color: #24743b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #progressBar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: #43a85e;
            transition: width 0.3s ease;
        }

        .button-row {
            margin-top: 24px;
        }

        button {
            min-height: 46px;
            padding: 0 20px;
            border: 0;
            border-radius: 10px;
            background: #2f914c;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:not(:disabled):hover {
            transform: translateY(-1px);
            background: #24763d;
        }

        button:disabled {
            background: #a9cbb0;
            cursor: not-allowed;
        }

        #countdown {
            margin: 0;
            color: #66756a;
            font-size: 14px;
            text-align: right;
        }

        #countdown.limit {
            color: #b3261e;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .dashboard {
                margin: 10px auto;
                padding: 24px 20px;
            }

            .button-row {
                align-items: stretch;
                flex-direction: column;
            }

            #countdown {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="dashboard">
        <h1>OTP Generator</h1>

        <section class="otp-box" aria-label="Current one-time password">
            <p class="label">Your current OTP</p>
            <p id="otp" aria-live="polite"></p>
        </section>

        <div class="count-row">
            <span>OTPs generated</span>
            <span id="otpCount">0 / 5</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="OTP generation limit" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
            <div id="progressBar"></div>
        </div>

        <div class="button-row">
            <button id="generateButton" type="button" disabled>Generate another OTP</button>
            <p id="countdown" aria-live="polite"></p>
        </div>

        <section class="history" aria-labelledby="historyTitle">
            <h2 id="historyTitle">Previous OTPs</h2>
            <ol id="otpHistory" aria-live="polite"></ol>
        </section>

    </main>

    <script>
        const otpText = document.getElementById("otp");
        const button = document.getElementById("generateButton");
        const countdown = document.getElementById("countdown");
        const otpCount = document.getElementById("otpCount");
        const progressBar = document.getElementById("progressBar");
        const progressTrack = document.querySelector(".progress-track");
        const otpHistory = document.getElementById("otpHistory");
        const maxOTPs = 5;
        let count = 0;

        function generateOTP() {
            if (count === maxOTPs) {
                return;
            }

            const otp = Math.floor(Math.random() * 9000) + 1000;
            count++;
            otpText.textContent = otp;
            otpCount.textContent = count + " / " + maxOTPs;
            const historyItem = document.createElement("li");
            const historyNumber = document.createElement("span");
            historyItem.textContent = "OTP " + count;
            historyNumber.textContent = otp;
            historyItem.appendChild(historyNumber);
            otpHistory.appendChild(historyItem);
            progressBar.style.width = (count / maxOTPs * 100) + "%";
            progressTrack.setAttribute("aria-valuenow", count);
            button.disabled = true;

            if (count === maxOTPs) {
                button.textContent = "Limit reached";
                countdown.textContent = "Limit reached — " + count + " of " + maxOTPs + " OTPs generated.";
                countdown.classList.add("limit");
                return;
            }

            let seconds = 3;

            countdown.classList.remove("limit");
            countdown.textContent = "Next OTP available in 30 seconds.";

            const timer = setInterval(function () {
                seconds--;

                if (seconds === 0) {
                    clearInterval(timer);
                    button.disabled = false;
                    countdown.textContent = "You can generate another OTP now.";
                } else {
                    countdown.textContent = "Next OTP available in " + seconds + " seconds.";
                }
            }, 1000);
        }

        button.addEventListener("click", generateOTP);
        generateOTP();
    </script>
</body>
</html>
